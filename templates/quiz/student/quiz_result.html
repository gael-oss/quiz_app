{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="wrapper">
  <h2 class="mb-4">Résultat&nbsp;: {{ session.quiz.titre }}</h2>

  <div class="result-grid">
      <p><strong>Date de début :</strong> {{ session.date_debut|date:"d/m/Y H:i" }}</p>
      <p><strong>Date de fin&nbsp;:</strong>  {{ session.date_fin|date:"d/m/Y H:i" }}</p>
      <p><strong>Score&nbsp;:</strong> {{ session.score|floatformat:2 }} %</p>
  </div>

  <a href="{% url 'quiz:student_quiz_list' %}" class="link-back">←&nbsp;Retour aux quiz</a>
</div>
{% endblock %}
